<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="theme-color" content="#f6f5f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>家計簿</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1f1f1d; --quiet: #6b6a66; --line: #e4e2dc;
    --accent: #2f6f5e; --accent-soft: #e3efe9; --warn: #c26a12; --warn-soft: #fbeedd;
    --bad: #b3261e; --bad-soft: #f9e2df; --chip: #efede8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #22221f; --ink: #f0efeb; --quiet: #a3a19b; --line: #34332f;
      --accent: #6cc1a6; --accent-soft: #1f3530; --warn: #f0a24f; --warn-soft: #3a2a17;
      --bad: #f2867d; --bad-soft: #3d201d; --chip: #2d2c29;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 12px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .month { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
  .month h1 { font-size: 17px; margin: 0; }
  .month button { border: 0; background: var(--chip); color: var(--ink); border-radius: 10px; width: 40px; height: 36px; font-size: 18px; }
  .label { font-size: 13px; color: var(--quiet); }
  .big { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
  .big.bad { color: var(--bad); }
  .sub { display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px; }
  .pill { background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 4px 10px; }
  .pill.warn { background: var(--warn-soft); } .pill.bad { background: var(--bad-soft); }
  .bar { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; margin: 14px 0 6px; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 99px; }
  .bar.warn > div { background: var(--warn); } .bar.bad > div { background: var(--bad); }
  .stack { position: relative; display: flex; gap: 2px; height: 22px; background: var(--chip); border-radius: 8px; overflow: hidden; margin: 14px 0 10px; }
  .stack > span { height: 100%; min-width: 2px; }
  .stack > span:last-of-type { border-radius: 0 6px 6px 0; }
  @media (min-width: 760px) { .stack { height: 28px; } .legend { font-size: 13px; } }
  .stack > i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--quiet); margin-bottom: 6px; }
  .legend b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  :root { --c-food: #eb6834; --c-trans: #2a78d6; --c-daily: #1baf7a; --c-social: #eda100; --c-beauty: #e87ba4; --c-tel: #6250d6; --c-other: #9a9891; }
  @media (prefers-color-scheme: dark) { :root { --c-food: #d95926; --c-trans: #3987e5; --c-daily: #199e70; --c-social: #c98500; --c-beauty: #d55181; --c-tel: #9085e9; --c-other: #77756f; } }
  .row { display: flex; gap: 8px; align-items: center; }
  .amount { flex: 1; font-size: 28px; font-weight: 600; padding: 8px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
  select, input[type=text], input[type=date] { font: inherit; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--bg); color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
  .chip { border: 1px solid transparent; background: var(--chip); color: var(--ink); border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 14px; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
  .chip.want.on { background: var(--warn-soft); border-color: var(--warn); }
  .field { margin-top: 12px; }
  .field input[type=text] { width: 100%; }
  .check { margin-top: 12px; border-radius: 12px; padding: 12px; background: var(--warn-soft); font-size: 14px; }
  .check b { font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn { flex: 1; border: 0; border-radius: 12px; padding: 13px; font: inherit; font-weight: 600; background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--chip); color: var(--ink); }
  .btn:disabled { opacity: .45; }
  /* 日付の見出しは帯にして、日の変わり目をはっきりさせる。今日の帯は緑で目立たせる */
  .day { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; color: var(--ink);
    background: var(--bg); border-radius: 10px; padding: 8px 12px; margin: 22px 0 2px; font-variant-numeric: tabular-nums; }
  .day:first-child { margin-top: 0; }
  .day .amt2 { color: var(--quiet); }
  .day.today { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
  .day.today .amt2 { color: var(--ink); }
  .day .now { font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 8px; margin-right: 6px; }
  .day + .item { border-top: 0; }
  .item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .item .what { flex: 1; min-width: 0; }
  .item .what small { color: var(--quiet); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .amt { text-align: right; font-variant-numeric: tabular-nums; }
  .item .amt small { display: block; color: var(--quiet); }
  .item .del { border: 0; background: none; color: var(--quiet); font-size: 18px; width: 32px; height: 32px; }
  .tag { font-size: 11px; border-radius: 6px; padding: 1px 6px; background: var(--warn-soft); margin-left: 4px; }
  .status { text-align: center; font-size: 12px; color: var(--quiet); margin-top: 8px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal .wd { text-align: center; font-size: 11px; color: var(--quiet); padding-bottom: 4px; }
  .cal .wd.sun { color: var(--bad); } .cal .wd.sat { color: var(--accent); }
  .cal button { border: 0; background: none; color: var(--ink); font: inherit; border-radius: 8px; padding: 4px 2px; min-height: 46px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
  .cal button .d { font-size: 12px; }
  .cal button .v { font-size: 10.5px; color: var(--quiet); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .cal button .vj { display: block; font-size: 9.5px; color: var(--quiet); opacity: .75; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1.1; }
  .cal button.over { background: var(--bad-soft); } .cal button.over .v, .cal button.over .vj { color: var(--bad); font-weight: 600; }
  .cal button.today .d { font-weight: 700; text-decoration: underline; }
  .cal button.sel { outline: 2px solid var(--accent); }
  .cal button:disabled { visibility: hidden; }
  .calfoot { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; font-size: 13px; color: var(--quiet); }
  .calfoot b { font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .morebtn { display: block; width: 100%; margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: none; color: var(--accent); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .linkbtn { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; padding: 0; }
  /* PCの広い画面: 入力欄とカレンダーを横に並べる */
  @media (min-width: 900px) {
    main { max-width: 1040px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
    .pair > .card { margin-bottom: 12px; }
    .cal button { min-height: 56px; }
    .cal button .v { font-size: 12px; }
    .cal button .vj { font-size: 10.5px; }
  }
  button.amount { text-align: right; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; min-height: 58px; cursor: pointer; }
  button.amount.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  button.amount .ph { color: var(--quiet); }
  button.amount small { font-size: 13px; font-weight: 400; color: var(--quiet); }
  .pad { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    box-shadow: 0 -8px 24px rgba(0,0,0,.08); }
  .pad[hidden] { display: none; }
  .pad button { border: 0; border-radius: 10px; background: var(--chip); color: var(--ink); font: inherit; font-size: 24px; height: 54px; }
  .pad button:active { filter: brightness(.92); }
  .pad .op, .pad .fn { font-size: 20px; }
  .pad .del { color: var(--bad); }
  .pad .ok { grid-row: span 2; height: auto; background: var(--accent); color: #fff; font-weight: 700; }
  .pad .wide { grid-column: span 2; }
  body.padopen main { padding-bottom: 260px; }
  @media (min-width: 900px) { .pad { left: 50%; right: auto; width: 420px; transform: translateX(-50%); border: 1px solid var(--line); border-radius: 16px 16px 0 0; } }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; }
  .empty { color: var(--quiet); font-size: 14px; text-align: center; padding: 12px 0; }
  /* スマホ: 左に今日使える金、右に予算と尽きる予測を縦に。PC: 3つを横に大きく並べる */
  .heroTop { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "today today" "budget run"; gap: 8px 12px; align-items: center; margin-bottom: 12px; }
  .todayBox { grid-area: today; } .budgetBox { grid-area: budget; } .runBox { grid-area: run; text-align: right; }
  .big2 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin: 2px 0 4px; font-variant-numeric: tabular-nums; }
  .big3 { font-size: 22px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .big3.bad, .bmeta.bad { color: var(--bad); }
  .pcOnly { display: none; } .blk { display: block; }
  .unsent { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; font-size: 14px; }
  .unsent small { display: block; font-size: 12px; color: var(--ink); opacity: .8; margin-top: 2px; }
  .unsent button { flex: none; border: 0; border-radius: 8px; background: var(--warn); color: #fff; padding: 8px 12px; font-size: 13px; }
  .pavg { font-size: 12px; opacity: .8; margin-left: 4px; }
  .bavg .jpy { display: none; }
  @media (min-width: 760px) { .bavg .jpy { display: inline; } }
  .budgetBox { display: flex; gap: 10px; align-items: center; }
  .donut { width: 58px; height: 58px; flex: none; }

  .donut .dpct { font-size: 8.5px; font-weight: 700; fill: var(--ink); font-variant-numeric: tabular-nums; }
  .donut .dpct.bad { fill: var(--bad); }
  @media (min-width: 760px) {
    .heroTop { grid-template-columns: 1fr 1fr 1fr; grid-template-areas: "today budget run"; gap: 16px; }
    .budgetBox, .runBox { text-align: left; border-left: 1px solid var(--line); padding-left: 20px; }
    .big2, .big3 { font-size: 44px; letter-spacing: -0.02em; line-height: 1.1; margin: 2px 0 6px; }
    .budgetBox .bmeta, .runBox .bmeta { font-size: 15px; }
    .bmeta b { font-size: 18px; }
    .pcOnly, .blk { display: inline; }
    .budgetBox { justify-content: flex-start; gap: 16px; }
    .donut { width: 112px; height: 112px; }
    .heroTop { align-items: start; }
  }
  .bmeta { font-size: 12.5px; color: var(--quiet); line-height: 1.5; white-space: nowrap; }
  .bmeta b { font-size: 15px; color: var(--ink); }
  .bmeta .bad, .bmeta b.bad { color: var(--bad); font-weight: 600; }
  .bmeta b.warnc { color: var(--warn); }
  @media (max-width: 380px) { .big2 { font-size: 24px; } }
  .jpy { color: var(--quiet); opacity: .75; font-size: 12px; font-weight: 400; margin-left: 6px; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .big + .jpyline { margin: -4px 0 8px; }
  .jpyline .jpy { margin-left: 0; font-size: 13px; }
  .item .amt .jpy { display: block; margin-left: 0; font-size: 11px; }
  .outlook h2, #fixed h2 { font-size: 15px; margin: 0 0 2px; }
  .outlook .row2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .outlook .row2:first-of-type { border-top: 0; }
  .outlook .row2 b { font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .outlook .row2 b.bad { color: var(--bad); }
  .outlook .row2 small { display: block; color: var(--quiet); font-size: 12px; }
  .outlook .note { font-size: 13px; color: var(--quiet); line-height: 1.6; margin-top: 6px; }
  .outlook .trip { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  /* スマホは今の残高だけ見せて、見通しはタップで開く。PCは全部出したまま */
  #fixed:not(.open) .fx-more { display: none; }
  .outlook .more-btn, #fixed .more-btn { display: block; width: 100%; margin-top: 4px; padding: 8px 0 0; border: 0; border-top: 1px solid var(--line); background: none; color: var(--quiet); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  @media (max-width: 899px) { .outlook:not(.open) .ol-more { display: none; } }
  @media (min-width: 900px) { .outlook .more-btn { display: none; } }
  .connect { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .connect .card { max-width: 460px; width: 100%; }
  .connect h2 { margin: 0 0 8px; font-size: 18px; }
  .connect p { color: var(--quiet); font-size: 14px; line-height: 1.6; margin: 0 0 12px; }
  .connect label { display: block; font-size: 13px; color: var(--quiet); margin: 10px 0 4px; }
  .connect input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
  .connect button { margin-top: 16px; width: 100%; padding: 12px; font-size: 16px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; }
  .connect .err { color: var(--warn); font-size: 14px; min-height: 1.4em; margin-top: 8px; }
  .relink { display: block; margin: 8px auto 0; background: none; border: 0; color: var(--quiet); font-size: 12px; text-decoration: underline; }
  /* ダブルタップや入力欄で勝手に拡大されないように */
  html, body, button, input, select, a { touch-action: manipulation; }
  input, select, textarea { font-size: max(16px, 1em); }
  /* 入力 / 分析 のタブ */
  .tabs { display: flex; gap: 4px; background: var(--chip); border-radius: 12px; padding: 4px; margin: 0 0 12px; }
  .tabs button { flex: 1; border: 0; border-radius: 9px; background: none; color: var(--quiet); font: inherit; font-weight: 600; padding: 8px; }
  .tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  body.t-in .only-ana, body.t-ana .only-in { display: none !important; }
  .advice h2 { font-size: 15px; margin: 0 0 4px; }
  .advice .adv { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.6; }
  .advice .adv:first-of-type { border-top: 0; }
  .advice .adv b { font-variant-numeric: tabular-nums; }
  .advice .adv .save { color: var(--accent); font-weight: 600; }
  .advice .adv small { display: block; color: var(--quiet); font-size: 12.5px; }
  .advice .next { background: var(--accent-soft); border-radius: 12px; padding: 12px; margin: 4px 0 8px; font-size: 14px; line-height: 1.7; }
  .advice .next ol { margin: 4px 0; padding-left: 20px; }
  .advice table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .advice td { padding: 3px 0; } .advice td.r { text-align: right; white-space: nowrap; } .advice td.q { color: var(--quiet); width: 52px; }
  .dayitems { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 6px; font-size: 14px; }
  .dayitems .di { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .dayitems .di span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dayitems .di span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* 食費: 必要な飯(ごはん)といらん飯 */
  .tag.bad { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
  .tag.good { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .homebtn { display: block; width: 100%; margin-top: 8px; border: 1px dashed var(--accent); background: var(--accent-soft); color: var(--ink);
    border-radius: 12px; padding: 10px; font: inherit; font-weight: 600; }
  #needRow[hidden] { display: none; }
  .eathint { font-size: 13px; color: var(--quiet); margin-top: 8px; line-height: 1.5; }
  .eathint b.bad { color: var(--bad); } .eathint b.good { color: var(--accent); }
  .cal button .d .hm { font-size: 9px; margin-left: 1px; }
  .food h2 { font-size: 15px; margin: 0 0 4px; }
  .food .big { color: var(--warn); }
  .food .fbar { display: flex; gap: 2px; height: 14px; border-radius: 7px; overflow: hidden; background: var(--chip); margin: 8px 0 4px; }
  .food .fbar span { height: 100%; }
  .food .row2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .food .row2 b { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .food .row2 small { display: block; color: var(--quiet); font-size: 12px; }
  .food .sec { font-size: 13px; font-weight: 600; color: var(--quiet); margin: 14px 0 2px; }
  .food .alert { background: var(--warn-soft); border-radius: 12px; padding: 10px 12px; margin-top: 12px; font-size: 14px; line-height: 1.6; }
  .food .alert.ok, .food .homebox { background: var(--accent-soft); }
  .food .homebox { border-radius: 12px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }
  .food .dots { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
  .food .dots span { width: 14px; height: 14px; border-radius: 4px; background: var(--chip); font-size: 9px; line-height: 14px; text-align: center; }
  .food .dots span.on { background: var(--accent); }
  .food .dots span.future { opacity: .35; }
  /* 家で食べたときのお祝い */
  .cele { position: fixed; inset: 0; pointer-events: none; z-index: 60; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .cele .msg { background: var(--card); border: 2px solid var(--accent); border-radius: 20px; padding: 16px 24px; text-align: center; font-size: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.18); animation: cpop .5s cubic-bezier(.2,1.6,.4,1) both, cfade .4s ease 2.6s forwards; }
  .cele .msg .e { font-size: 52px; line-height: 1.1; }
  .cele .msg b { display: block; font-size: 20px; margin: 4px 0 2px; }
  .cele i { position: absolute; bottom: -40px; font-style: normal; font-size: 26px; animation: crise 2.4s ease-out forwards; }
  @keyframes cpop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes cfade { to { opacity: 0; transform: translateY(-12px); } }
  @keyframes crise { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(-105vh) rotate(var(--r)); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cele i { display: none; } .cele .msg { animation: cfade .4s ease 2.6s forwards; } }
</style>
</head>
<body class="t-in">
<main>
  <div class="month">
    <button id="prev" aria-label="前の月">‹</button>
    <h1 id="monthTitle"></h1>
    <button id="next" aria-label="次の月">›</button>
  </div>

  <nav class="tabs" id="tabs">
    <button type="button" data-tab="in" class="on">入力</button>
    <button type="button" data-tab="ana">分析</button>
  </nav>

    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="*" class="op">×</button><button data-k="del" class="fn del">Del</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="-" class="op">−</button><button data-k="ok" class="ok">OK</button>

<script>
// ---- 計算(画面と切り離した純粋な関数) ----
// 家賃・光熱費・通信費・サブスクなどの固定費。残高からは引くが、カレンダー・明細・月の予算には入れない(専用の欄で入力)
const FIXED = ['家賃', '光熱費', '通信費', 'サブスク', '固定費'];
const isFixed = t => FIXED.includes(t.category);
const Calc = {
  pad: n => String(n).padStart(2, '0'),
  ymd(d) { return d.getFullYear() + '-' + this.pad(d.getMonth() + 1) + '-' + this.pad(d.getDate()); },
  daysIn(month) { const [y, m] = month.split('-').map(Number); return new Date(y, m, 0).getDate(); },
  shift(month, k) { const [y, m] = month.split('-').map(Number); const d = new Date(y, m - 1 + k, 1); return d.getFullYear() + '-' + this.pad(d.getMonth() + 1); },
  // 予算に数える取引か(旅行タグ付き・除外区分・換算待ちは数えない)
  counts(t, s) { return !t.trip && !isFixed(t) && !s.excluded.includes(t.category) && typeof t.myr === 'number' && !isNaN(t.myr); },
  sum(list) { return Math.round(list.reduce((a, t) => a + t.myr, 0) * 100) / 100; },
  summary(tx, s, month, today) {
    const inBudget = tx.filter(t => this.counts(t, s));
    const spent = this.sum(inBudget);
    const dim = this.daysIn(month);
    const isCurrent = today.slice(0, 7) === month;
    const out = { spent, budget: s.budget, left: Math.round((s.budget - spent) * 100) / 100, ratio: s.budget ? spent / s.budget : 0, isCurrent };
    if (isCurrent) {
      const day = Number(today.slice(8));
      const remaining = dim - day + 1;                       // 今日を含む残り日数
      const spentToday = this.sum(inBudget.filter(t => t.date === today));
      const before = spent - spentToday;                     // 昨日までに使った額
      out.remaining = remaining;
      out.daily = Math.round((s.budget - before) / remaining * 100) / 100;   // 今日の1日分(繰越込み)
      out.todayLeft = Math.round((out.daily - spentToday) * 100) / 100;
      const foodToday = this.sum(tx.filter(t => t.date === today && t.category === '食費' && typeof t.myr === 'number'));
      out.foodLeft = Math.round((s.foodDaily - foodToday) * 100) / 100;
      out.spentToday = spentToday;
    }
    return out;
  },
  // 買う前チェック: この金額を使うと明日からの1日分がどう変わるか
  impact(sum, s, amountMyr) {
    if (!sum.isCurrent) return null;
    if (sum.remaining <= 1) return { last: true, before: sum.todayLeft, after: Math.round((sum.todayLeft - amountMyr) * 100) / 100 };
    const r = sum.remaining - 1;
    const base = s.budget - sum.spent;
    return { before: Math.round(base / r * 100) / 100, after: Math.round((base - amountMyr) / r * 100) / 100, days: r };
  },
  rm(n) { const v = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (n < 0 ? '-RM' : 'RM') + v; },
};

// ---- サーバーとのやりとり ----
// Apps Script の中で開いたときは google.script.run、別の場所(Netlifyなど)で開いたときは
// 保存しておいたURLと合言葉でAPIを呼ぶ。テスト時は window.mockApi
const API = {
  get() { try { return JSON.parse(localStorage.getItem('kb-api') || 'null'); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem('kb-api', JSON.stringify(v)); } catch (e) {} },
  inGas() { return typeof google !== 'undefined' && google.script && google.script.run; },
};
async function callApi(conf, name, args) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 25000);
  try {
    // text/plain にすると事前確認(CORS preflight)なしで Apps Script に届く
    const res = await fetch(conf.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: conf.key, fn: name, args }), redirect: 'follow', signal: ctl.signal });
    const text = await res.text();
    let out;
    try { out = JSON.parse(text); } catch (e) { throw new Error('URLが違うか、デプロイのアクセスが「全員」になっていません'); }
    if (!out.ok) { const err = new Error(out.error); err.server = true; throw err; }
    return out.result;
  } finally { clearTimeout(timer); }
}
function call(name, ...args) {
  if (window.mockApi) return Promise.resolve().then(() => window.mockApi[name](...args));
  if (API.inGas()) return new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[name](...args));
  const conf = API.get();
  if (!conf) return Promise.reject(new Error('未接続'));
  return callApi(conf, name, args);
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

// ---- 状態 ----
const today = () => Calc.ymd(new Date());
// 表示中の月の設定。「月別予算」にその月があればそちらを使う(なければ通常の月予算)
const cfg = () => { const mb = S.settings.monthBudgets || {}; return Object.assign({}, S.settings, mb[S.month] > 0 ? { budget: mb[S.month] } : {}); };
const S = {
  month: today().slice(0, 7),
  settings: store.get('kb-settings', { budget: 1250, foodDaily: 20, wishLine: 50, stayCurrency: 'MYR', tripTag: '',
    categories: ['食費', '交通費', '日用品', '交際費', '美容', '通信費', '趣味・娯楽', '健康・医療', 'その他'], excluded: ['家賃', '固定費'] }),
  tx: [], queue: store.get('kb-queue', []), loading: true, offline: false, spentSince: store.get('kb-since', null), rentMonths: store.get('kb-rent', []),
  form: { category: '食費', howEat: '', want: false }, selDay: null, listAll: false,
};
// ---- 食費の種類: 「ごはん」が必要な飯、それ以外はいらん飯。家ごはんは金額なし(材料は買ったときに記録済み) ----
const FOOD_KINDS = ['ごはん', 'デリバリー', 'おやつ・カフェ', '外の飲み物', 'ついで買い'];
const HOME = '家ごはん', OTHER_EXTRA = 'その他のいらん飯';
const OLD_KIND = { '自炊': 'ごはん', '外食': 'ごはん', 'カフェ・おやつ': 'おやつ・カフェ' };   // 前の「食べ方」の読みかえ
// 前の記録で種類がはっきりしないものは、名前から飲み物・おやつを見分ける
const DRINK_RE = /スプライト|コーラ|ジュース|お茶|茶|コーヒー|珈琲|ラテ|ティー|ボバ|タピオカ|飲み物|ドリンク|水|ミロ|milo|coke|sprite|drink|tea|coffee|latte|boba/i;
const SNACK_RE = /お菓子|菓子|おやつ|スナック|チョコ|アイス|ケーキ|ドーナツ|クッキー|グミ|ポテチ|パン屋|カフェ|snack|choco|ice ?cream|cake|donut/i;
function foodKind(t) {
  if (t.category !== '食費') return '';
  if (t.howEat === HOME || FOOD_KINDS.includes(t.howEat)) return t.howEat;
  const n = String(t.note || '');
  if (DRINK_RE.test(n)) return '外の飲み物';
  if (SNACK_RE.test(n)) return 'おやつ・カフェ';
  const k = OLD_KIND[t.howEat];
  if (k) return k;
  return t.want ? OTHER_EXTRA : 'ごはん';
}
const isExtraFood = t => { const k = foodKind(t); return !!k && k !== 'ごはん' && k !== HOME; };
const isHome = t => foodKind(t) === HOME;
// 1回のごはんの割高・お得の線(設定シートの「割高の線(MYR)」「お得の線(MYR)」で変えられる)
const mealLines = () => { const r = S.settings.raw || {}; return { high: Number(r['割高の線(MYR)']) || 15, low: Number(r['お得の線(MYR)']) || 10 }; };
function mealMark(t) {
  if (isHome(t)) return 'home';
  if (foodKind(t) !== 'ごはん' || !(t.myr > 0)) return '';
  const l = mealLines();
  return t.myr > l.high ? 'pricey' : t.myr < l.low ? 'good' : '';
}
// 明細に付ける印
function tagsOf(t) {
  const m = mealMark(t);
  return (t.category === '食費' ? (isExtraFood(t) ? '<span class="tag">いらん飯</span>' : '') : t.want ? '<span class="tag">欲しい</span>' : '') +
    (m === 'pricey' ? '<span class="tag bad">割高</span>' : m === 'good' ? '<span class="tag good">👍 お得</span>' : m === 'home' ? '<span class="tag good">🏠 家ごはん</span>' : '');
}
const subOf = t => [t.category, foodKind(t) || t.howEat].filter(Boolean).join('・');
const CURRENCIES = ['MYR', 'JPY', 'SGD', 'THB', 'BDT', 'USD', 'その他'];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

// ---- 日本円の目安(小さく薄く横に出す) ----
// レートは公開の為替API(1日2回まで取り直す)。取れないときは円で記録した明細のレートを使う
const FX = { jpy: (store.get('kb-jpy', null) || {}).rate || null };
async function refreshJpy() {
  const c = store.get('kb-jpy', null);
  if (c && Date.now() - c.t < 12 * 3600 * 1000) return;
  const srcs = [['https://api.frankfurter.app/latest?from=MYR&to=JPY', j => j.rates.JPY],
    ['https://open.er-api.com/v6/latest/MYR', j => j.rates.JPY]];
  for (const [u, pick] of srcs) {
    try {
      const r = pick(await (await fetch(u)).json());
      if (r > 0) { FX.jpy = r; store.set('kb-jpy', { rate: r, t: Date.now() }); render(); return; }
    } catch (e) {}
  }
}
function jpyRate() {
  if (FX.jpy) return FX.jpy;
  const t = S.tx.find(x => x.currency === 'JPY' && x.myr > 0);
  return t ? t.amount / t.myr : null;
}
const jp = myr => { const r = jpyRate(); return r && typeof myr === 'number' ? '<span class="jpy">≈¥' + Math.round(Math.abs(myr) * r).toLocaleString('en-US') + '</span>' : ''; };

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2600); }

function monthTx() {
  const pending = S.queue.filter(q => q.date.slice(0, 7) === S.month && !S.tx.some(t => t.id === q.id));
  return S.tx.concat(pending);
}

// ---- 描画 ----
// 区分ごとの色(区分に固定。順位で塗り替えない)。食費は一番目立つオレンジ
const CAT_COLORS = { '食費': 'food', '交通費': 'trans', '日用品': 'daily', '交際費': 'social', '美容': 'beauty', '通信費': 'tel' };
function stackBar(sum) {
  const by = {};
  monthTx().filter(t => Calc.counts(t, S.settings)).forEach(t => {
    const k = CAT_COLORS[t.category] ? t.category : 'その他';
    by[k] = (by[k] || 0) + t.myr;
  });
  const order = Object.keys(CAT_COLORS).concat(['その他']).filter(k => by[k] > 0);
  const scale = Math.max(sum.budget, sum.spent) || 1;
  const color = k => 'var(--c-' + (CAT_COLORS[k] || 'other') + ')';
  let bar = order.map(k => '<span style="width:' + (by[k] / scale * 100).toFixed(2) + '%;background:' + color(k) + '" title="' + k + ' ' + Calc.rm(by[k]) + '"></span>').join('');
  if (sum.spent > sum.budget) bar += '<i style="left:' + (sum.budget / scale * 100).toFixed(2) + '%" title="予算 ' + Calc.rm(sum.budget) + '"></i>';
  const legend = order.map(k => '<span><span class="sw" style="background:' + color(k) + '"></span>' + k + ' <b>' + Calc.rm(Math.round(by[k] * 100) / 100) + '</b></span>').join('');
  return '<div class="stack" role="img" aria-label="区分ごとの支出">' + bar + '</div><div class="legend">' + legend + '</div>';
}

// 月の予算と、このペースだといつ尽きるか
function runOut(sum) {
  const t = today(), day = Number(t.slice(8)), dim = sum.remaining + day - 1;
  const [y, m] = S.month.split('-').map(Number);
  if (sum.spent >= sum.budget) {
    // 予算を超えた日を探す
    let acc = 0, when = t;
    for (let d = 1; d <= day; d++) {
      const key = S.month + '-' + String(d).padStart(2, '0');
      acc += Calc.sum(monthTx().filter(x => x.date === key && Calc.counts(x, S.settings)));
      if (acc >= sum.budget) { when = key; break; }
    }
    return { over: true, date: when, avg: Math.round(sum.spent / day * 100) / 100 };
  }
  const pace = sum.spent / day, avg = Math.round(pace * 100) / 100;
  if (!(pace > 0)) return { ok: true, leftAtEnd: sum.budget };
  const lastsDays = Math.floor((sum.budget - sum.spent) / pace);   // 今日のあと何日もつか
  if (day + lastsDays >= dim) return { ok: true, avg, leftAtEnd: Math.round((sum.budget - pace * dim) * 100) / 100 };
  return { avg, date: S.month + '-' + String(day + lastsDays + 1).padStart(2, '0') };
}
// 予算に対して使った割合のドーナツ。使った分は1色(80%でオレンジ、100%で赤)、残りはグレー
function donut(sum, cls) {
  const pct = Math.round(sum.ratio * 100), R = 15.9155; // 円周 100
  const color = pct >= 100 ? 'var(--bad)' : pct >= 80 ? 'var(--warn)' : 'var(--accent)';
  return '<svg class="donut ' + cls + '" viewBox="0 0 40 40" role="img" aria-label="予算の' + pct + '%を使用"><g transform="rotate(-90 20 20)">' +
    '<circle r="' + R + '" cx="20" cy="20" fill="none" stroke="var(--chip)" stroke-width="6"/>' +
    '<circle r="' + R + '" cx="20" cy="20" fill="none" stroke="' + color + '" stroke-width="6" stroke-linecap="' + (pct >= 100 ? 'butt' : 'round') + '" stroke-dasharray="' + Math.min(100, sum.ratio * 100).toFixed(2) + ' 100"/></g>' +
    '<text x="20" y="21" text-anchor="middle" dominant-baseline="middle" class="dpct' + (pct >= 100 ? ' bad' : '') + '">' + pct + '%</text></svg>';
}
function budgetBox(sum) {
  const r = runOut(sum), md = d => Number(d.slice(5, 7)) + '/' + Number(d.slice(8));
  const pct = Math.round(sum.ratio * 100);
  const lvl = pct >= 100 ? 'bad' : pct >= 80 ? 'warnc' : '';
  const when = r.over ? '<div class="label">予算オーバー</div><div class="big3 bad">' + md(r.date) + '</div><div class="bmeta">に超えました</div>'
    : r.ok ? '<div class="label">このペースだと</div><div class="big3">月末まで</div><div class="bmeta">もつ見込み</div>'
    : '<div class="label">このペースだと</div><div class="big3 bad">' + md(r.date) + '</div><div class="bmeta bad">に尽きる</div>';
  return '<div class="budgetBox">' + donut(sum, 'all') + '<div><div class="label">今月の予算</div>' +
    '<div class="big2">' + Calc.rm(sum.budget).replace(/\.00$/, '') + '</div>' +
    '<div class="bmeta"><b class="' + lvl + '">' + pct + '%</b> 使用<span class="pcOnly">・</span><span class="blk">残り ' + Calc.rm(Math.max(0, sum.left)) + '</span></div></div></div>' +
    '<div class="runBox">' + when + (r.avg ? '<div class="bmeta bavg">1日平均 ' + Calc.rm(r.avg) + jp(r.avg) + '</div>' : '') + '</div>';
}

function renderHero() {
  const [y, m] = S.month.split('-');
  $('monthTitle').textContent = y + '年' + Number(m) + '月';
  const sum = Calc.summary(monthTx(), cfg(), S.month, today());
  let h = '';
  if (S.settings.tripTag) h += '<div class="label">滞在中: ' + esc(S.settings.tripTag) + '(この間の支出は旅行予算に入ります)</div>';
  if (sum.isCurrent) {
    const foodAvg = Math.round(Calc.sum(monthTx().filter(t => t.category === '食費' && typeof t.myr === 'number' && t.date <= today())) / Number(today().slice(8)) * 100) / 100;
    const food = (sum.foodLeft >= 0 ? '今日の食費 あと ' + Calc.rm(sum.foodLeft) : '今日の食費 目安を ' + Calc.rm(-sum.foodLeft) + ' オーバー') +
      '<span class="pavg">(1日平均 ' + Calc.rm(foodAvg) + ')</span>';
    h += '<div class="heroTop"><div class="todayBox"><div class="label">' + (sum.todayLeft >= 0 ? '今日使える金' : '今日の1日分を超えた額') + '</div>' +
      '<div class="big ' + (sum.todayLeft < 0 ? 'bad' : '') + '">' + Calc.rm(sum.todayLeft) + '</div>' + (jp(sum.todayLeft) ? '<div class="jpyline">' + jp(sum.todayLeft) + '</div>' : '') +
      '</div>' + budgetBox(sum) + '</div>' +
      '<div class="sub"><span class="pill ' + (sum.foodLeft < 0 ? 'bad' : sum.foodLeft < S.settings.foodDaily * 0.3 ? 'warn' : '') + '">' + food + '</span>' +
      '<span class="pill">1日分 ' + Calc.rm(sum.daily) + '(残り' + sum.remaining + '日)</span></div>';
  } else {
    h += '<div class="label">' + (sum.left >= 0 ? 'この月の残り' : 'この月の予算オーバー') + '</div>' +
      '<div class="big ' + (sum.left < 0 ? 'bad' : '') + '">' + Calc.rm(sum.left) + '</div>' + (jp(sum.left) ? '<div class="jpyline">' + jp(sum.left) + '</div>' : '');
  }
  h += stackBar(sum) +
    '<div class="label">使った ' + Calc.rm(sum.spent) + jp(sum.spent) + ' / 予算 ' + Calc.rm(sum.budget) + '(' + Math.round(sum.ratio * 100) + '%)</div>';
  if (S.queue.length) {
    h = '<div class="unsent"><span>スプシに未送信 <b>' + S.queue.length + '件</b>' + (S.lastError ? '<small>' + esc(S.lastError) + '</small>' : '') + '</span>' +
      '<button type="button" id="resend">今すぐ送る</button></div>' + h;
  }
  $('hero').innerHTML = h;
  return sum;
}

// ---- 金額テンキー(セント入力: MYRは 1→0.01、125→1.25。円などは整数) ----
const NO_DECIMAL = ['JPY', 'KRW', 'IDR', 'VND', 'CLP', 'ISK', 'HUF', 'TWD'];
const K = { nums: [], ops: [], cur: '' };           // nums: 確定した数(桁の文字列)、ops: 演算子、cur: 入力中の数
const decOf = () => NO_DECIMAL.includes($('currency').value) ? 0 : 2;
const numOf = d => Number(d || '0') / Math.pow(10, decOf());
const fmtN = v => v.toLocaleString('en-US', { minimumFractionDigits: decOf(), maximumFractionDigits: decOf() });
const OPS = { '+': '+', '-': '−', '*': '×', '/': '÷' };
function evalK() {
  const nums = K.nums.map(numOf), ops = K.ops.slice();
  if (K.cur !== '' || !ops.length) nums.push(numOf(K.cur)); else ops.pop();
  // × ÷ を先に計算
  const n = [nums[0]], o = [];
  ops.forEach((op, i) => {
    const v = nums[i + 1];
    if (op === '*') n[n.length - 1] *= v;
    else if (op === '/') n[n.length - 1] = v ? n[n.length - 1] / v : NaN;
    else { o.push(op); n.push(v); }
  });
  let r = n[0];
  o.forEach((op, i) => { r = op === '+' ? r + n[i + 1] : r - n[i + 1]; });
  const f = Math.pow(10, decOf());
  return Math.round(r * f) / f;
}
function amountValue() { return (K.nums.length || K.cur !== '') ? evalK() : NaN; }
function renderAmount() {
  const empty = !K.nums.length && K.cur === '';
  let txt = '';
  K.nums.forEach((d, i) => { txt += fmtN(numOf(d)) + ' ' + OPS[K.ops[i]] + ' '; });
  if (K.cur !== '' || !K.nums.length) txt += fmtN(numOf(K.cur));
  $('expr').textContent = empty ? fmtN(0) : txt.trim();
  $('expr').className = empty ? 'ph' : '';
  const v = amountValue();
  $('result').textContent = K.ops.length && !isNaN(v) ? '= ' + fmtN(v) : (K.ops.length ? '計算できません' : '');
}
function keyIn(k) {
  if (/^\d+$/.test(k)) { if ((K.cur + k).length <= 9) K.cur = (K.cur + k).replace(/^0+(?=\d)/, ''); if (K.cur === '0' || K.cur === '00') K.cur = ''; }
  else if (OPS[k]) {
    if (K.cur !== '') { K.nums.push(K.cur); K.ops.push(k); K.cur = ''; }
    else if (K.ops.length) K.ops[K.ops.length - 1] = k;
  }
  else if (k === 'del') { if (K.cur !== '') K.cur = K.cur.slice(0, -1); else if (K.ops.length) { K.ops.pop(); K.cur = K.nums.pop(); } }
  else if (k === 'ac') { K.nums = []; K.ops = []; K.cur = ''; }
  else if (k === 'ok') {
    const v = amountValue();
    if (K.ops.length && v > 0) { const f = Math.pow(10, decOf()); K.nums = []; K.ops = []; K.cur = String(Math.round(v * f)); }
    else if (!K.ops.length) closePad();
  }
  renderAmount(); renderCheck();
}
function openPad() { $('pad').hidden = false; $('amount').classList.add('on'); document.body.classList.add('padopen'); }
function closePad() { $('pad').hidden = true; $('amount').classList.remove('on'); document.body.classList.remove('padopen'); }

function amountMyr() {
  const a = amountValue();
  if (!(a > 0)) return null;
  const cur = $('currency').value;
  if (cur === 'MYR') return a;
  const rate = store.get('kb-rate-' + cur, null);
  return rate ? Math.round(a * rate * 100) / 100 : null;
}

function renderCheck() {
  const a = amountValue();
  const needKind = S.form.category === '食費' && !S.form.howEat;
  $('save').disabled = !(a > 0) || needKind;
  const box = $('check');
  const myr = amountMyr();
  renderEatHint(myr);
  const sum = Calc.summary(monthTx(), cfg(), S.month, today());
  const isToday = $('date').value === today();
  if (!S.form.want || myr === null || !isToday || !sum.isCurrent) {
    box.hidden = true; $('skip').hidden = true; $('save').textContent = '記録する'; return;
  }
  const im = Calc.impact(sum, cfg(), myr);
  let h = im.last
    ? '今日の残りが <b>' + Calc.rm(im.before) + '</b> → <b>' + Calc.rm(im.after) + '</b> になります。'
    : '明日からの1日分が <b>' + Calc.rm(im.before) + '</b> → <b>' + Calc.rm(im.after) + '</b> に減ります(残り' + im.days + '日)。';
  if (S.settings.foodDaily && S.form.category === '食費') {

}

// ---- 年末までの見通し: このペースで使うと、旅行や貯金にいくら回せるか ----
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
// 送った・消した記録を、次に読み込むまでの間も残高に反映する
function sinceAdjust(t, sign) {
  const since = String((S.settings.raw || {})['残高の日付'] || '');
  if (!since || !(t.date > since) || typeof S.spentSince !== 'number') return;
  S.spentSince = Math.round((S.spentSince + sign * (t.myr || 0)) * 100) / 100; store.set('kb-since', S.spentSince);
  if (t.category === '家賃' && sign > 0 && !S.rentMonths.includes(t.date.slice(0, 7))) { S.rentMonths.push(t.date.slice(0, 7)); store.set('kb-rent', S.rentMonths); }
}
function outlook() {
  const raw = S.settings.raw;
  if (!raw) return null;
  const bal = Number(raw['残高(MYR)']), since = String(raw['残高の日付'] || '');
  if (!(bal > 0) || !/^\d{4}-\d{2}-\d{2}$/.test(since)) return { need: true };
  const end = /^\d{4}-\d{2}-\d{2}$/.test(String(raw['見通しの期日'])) ? String(raw['見通しの期日']) : today().slice(0, 4) + '-12-31';
  const rent = Number(raw['家賃(MYR/月)']) || 0;
  // 今の残高 = 残高 − 残高の日付より後の支出すべて(サーバーの集計 + まだ送っていない分)
  const unsent = S.queue.filter(q => q.date > since && !S.tx.some(t => t.id === q.id)).reduce((a, q) => a + (q.myr || 0), 0);
  const now = Math.round((bal - (S.spentSince || 0) - unsent) * 100) / 100;
  // これから払う家賃: 残高の日付の翌月から期日の月までで、「家賃」をまだ記録していない月
  const paid = new Set(S.rentMonths || []);
  S.queue.filter(q => q.category === '家賃' && q.date > since).forEach(q => paid.add(q.date.slice(0, 7)));
  let months = 0;
  for (let m = Calc.shift(since.slice(0, 7), 1); m <= end.slice(0, 7); m = Calc.shift(m, 1)) if (!paid.has(m)) months++;
  const t = today();
  const daysLeft = Math.max(0, daysBetween(t, end));           // 明日から期日まで
  const cur = Calc.summary(S.month === t.slice(0, 7) ? monthTx() : [], cfg(), t.slice(0, 7), t);
  const dayNo = Number(t.slice(8));
  const pace = Math.round(cur.spent / dayNo * 100) / 100;       // 今月の1日あたり(予算に入る支出だけ)
  const plan = Math.round(S.settings.budget * 12 / 365 * 100) / 100; // 通常の月予算どおりの1日分
  const base = now - rent * months;
  const r2 = n => Math.round(n * 100) / 100;
  const trips = String(raw['旅行の予算'] || '').split(',').map(x => x.trim().match(/^(.+?)\s*=\s*([\d.]+)$/)).filter(Boolean).map(m => ({ name: m[1], amt: Number(m[2]) }));
  return { now, end, daysLeft, months, rent, pace, plan, atPace: r2(base - pace * daysLeft), atPlan: r2(base - plan * daysLeft), trips, tripSum: r2(trips.reduce((a, x) => a + x.amt, 0)) };
}
function renderOutlook() {
  const box = $('outlook');
  const o = S.month === today().slice(0, 7) ? outlook() : null;
  box.hidden = !o;
  if (!o) return;
  if (o.need) {
    box.innerHTML = '<h2>年末までの見通し</h2><div class="note">設定シートに「残高(MYR)」と「残高の日付」を入れると、このペースで使ったときに旅行や貯金へいくら回せるかをここに出します。</div>';
    return;
  }
  const [, em, ed] = o.end.split('-');
  const val = n => '<b class="' + (n < 0 ? 'bad' : '') + '">' + Calc.rm(n) + '</b>' + jp(n);
  // 残高がいつ尽きるか(今月のペース+家賃が続くとして)
  const monthly = o.pace * 365 / 12 + o.rent;
  let dry = '';
  if (monthly > 0 && o.now > 0) { const d = new Date(); d.setDate(d.getDate() + Math.floor(o.now / monthly * 365 / 12)); dry = 'このペース+家賃だと ' + d.getFullYear() + '年' + (d.getMonth() + 1) + '月ごろ尽きる'; }
  const open = store.get('kb-outlook-open', false);
  box.classList.toggle('open', open);
  let h = '<div class="row2"><span>今の残高<small>' + (dry || '記録した支出を引いた計算上の額') + '</small></span><span>' + val(o.now) + '</span></div>' +
    '<button type="button" class="more-btn" id="olToggle">' + (open ? '▲ 見通しを閉じる' : '▼ ' + Number(em) + '/' + Number(ed) + 'までの見通しを見る') + '</button><div class="ol-more">' +
    '<h2 style="margin-top:12px">' + Number(em) + '/' + Number(ed) + 'までの見通し</h2><div class="label">あと' + o.daysLeft + '日' + (o.months ? '・これから払う家賃 ' + Calc.rm(o.rent) + '×' + o.months + 'か月を引いたあと' : '') + '</div>' +
    '<div class="row2"><span>今月のペースのまま<small>1日 ' + Calc.rm(o.pace) + '</small></span><span>' + val(o.atPace) + '</span></div>' +
    '<div class="row2"><span>予算どおりなら<small>1日 ' + Calc.rm(o.plan) + '(月 ' + Calc.rm(S.settings.budget) + ')</small></span><span>' + val(o.atPlan) + '</span></div>';
  const diff = Math.round((o.atPlan - o.atPace) * 100) / 100;
  if (diff > 0) h += '<div class="note">予算どおりにすると、旅行に <b>' + Calc.rm(diff) + '</b>' + jp(diff) + ' 多く回せます。</div>';
  if (o.trips.length) {
    h += '<div class="note" style="margin-top:10px">旅行の予算</div>' + o.trips.map(x => '<div class="trip"><span>' + esc(x.name) + '</span><span>' + Calc.rm(x.amt) + jp(x.amt) + '</span></div>').join('') +
      '<div class="row2"><span>旅行のあと残る<small>今月のペースのまま</small></span><span>' + val(Math.round((o.atPace - o.tripSum) * 100) / 100) + '</span></div>';
  } else {
    h += '<div class="note">日本・キロロ・バングラデシュの費用が決まったら、設定シートの「旅行の予算」に バングラデシュ=1500, 日本=3000 のように入れると、ここで引き算します。</div>';
  }
  box.innerHTML = h + '</div>';
  box.querySelector('#olToggle').onclick = () => { store.set('kb-outlook-open', !open); renderOutlook(); };
}

// 家賃・光熱費の欄: この月の分の一覧と合計
const FX_CATS = ['家賃', '光熱費', '通信費', 'サブスク'];
// 前に「通信費」で入れた Spotify などのサブスクは、サブスクとして数える
const fxKind = t => t.category === '通信費' && /spotify|claude|netflix|ネトフリ|google/i.test(t.note || '') ? 'サブスク' : t.category;
let fxCat = '家賃';
const fxAmount = () => { const v = Number(String($('fxAmt').value).replace(/[,\s]/g, '')); return v > 0 ? Math.round(v * 100) / 100 : NaN; };
function renderFixed() {
  $('fxCats').innerHTML = FX_CATS.map(c => '<button type="button" class="chip' + (c === fxCat ? ' on' : '') + '" data-fx="' + c + '">' + c + '</button>').join('');
  if (!$('fxDate').value) $('fxDate').value = today();
  $('fxSave').disabled = !(fxAmount() > 0);
  const open = store.get('kb-fixed-open', false);
  $('fixed').classList.toggle('open', open);
  $('fxToggle').textContent = open ? '▲ 閉じる' : '▼ 入力・明細を見る';
  const tx = monthTx().filter(isFixed).sort((a, b) => b.date.localeCompare(a.date));
  const total = Calc.sum(tx.filter(t => typeof t.myr === 'number'));

// ---- アドバイス: 来月や今後減らせそうなところを、記録から計算して出す ----
// 減らせる額は「1か月(30日)あたり」にそろえる
function advise(tx, s, month, td) {
  const dim = Calc.daysIn(month);
  const days = td.slice(0, 7) === month ? Number(td.slice(8)) : td.slice(0, 7) > month ? dim : 0;
  if (!days) return null;
  const list = tx.filter(t => Calc.counts(t, s) && t.date <= td);
  if (!list.length) return null;
  const perMonth = v => v / days * 30;                        // この期間の額を1か月分に
  const r2 = n => Math.round(n * 100) / 100;
  const total = Calc.sum(list);
  const tips = [];
  // 区分ごと
  const byCat = {};
  list.forEach(t => { byCat[t.category] = (byCat[t.category] || 0) + t.myr; });
  const cats = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]).map(k => ({ name: k, sum: r2(byCat[k]), share: byCat[k] / total }));
  // 食費の種類ごと(家ごはんは金額なしなので数えない)
  const food = list.filter(t => t.category === '食費');
  const eat = {};
  food.filter(t => !isHome(t)).forEach(t => { const k = foodKind(t); (eat[k] = eat[k] || { n: 0, sum: 0 }); eat[k].n++; eat[k].sum += t.myr; });
  const avg = k => eat[k] ? eat[k].sum / eat[k].n : 0;
  const perWeek = k => eat[k] ? eat[k].n / days * 7 : 0;
  // いらん飯: 週の回数を半分に
  [['デリバリー'], ['おやつ・カフェ'], ['ついで買い'], ['外の飲み物', '水を持って出て、外の飲み物を']].forEach(([k, label]) => {
    if (!eat[k]) return;
    const w = perWeek(k), cut = Math.max(1, Math.round(w / 2));
    tips.push({ key: k, save: r2(Math.min(perMonth(eat[k].sum), avg(k) * cut * 30 / 7)),
      title: (label || k + 'を') + '週' + cut + '回へらす',
      body: k + 'は ' + eat[k].n + '回で ' + Calc.rm(r2(eat[k].sum)) + '(1回平均 ' + Calc.rm(r2(avg(k))) + '、週' + w.toFixed(1) + '回ペース)。' });
  });
  // 必要な飯でも、1回が割高の線を超えた分
  const ml = mealLines();
  const pricey = food.filter(t => mealMark(t) === 'pricey');
  if (pricey.length) {
    const ex = pricey.reduce((a, t) => a + t.myr - ml.high, 0);
    tips.push({ key: '割高', save: r2(perMonth(ex)), title: 'ごはんを1回 ' + Calc.rm(ml.high) + ' までに',
      body: Calc.rm(ml.high) + 'を超えた割高なごはんは ' + pricey.length + '回(1回平均 ' + Calc.rm(r2(Calc.sum(pricey) / pricey.length)) + '、超えた分の合計 ' + Calc.rm(r2(ex)) + ')。家ごはんにすればもっと浮きます。' });
  }
  // 食費が1日の目安を超えた日
  if (s.foodDaily) {
    const fd = {};
    food.forEach(t => { fd[t.date] = (fd[t.date] || 0) + t.myr; });
    const overDays = Object.keys(fd).filter(d => fd[d] > s.foodDaily);
    const extra = overDays.reduce((a, d) => a + fd[d] - s.foodDaily, 0);
    if (overDays.length >= 3) tips.push({ key: '食費の目安', save: r2(perMonth(extra) / 2),
      title: '食費が1日 ' + Calc.rm(s.foodDaily) + ' を超える日を半分に',
      body: '食費が目安を超えた日は ' + overDays.length + '日(超えた分の合計 ' + Calc.rm(r2(extra)) + ')。' });
  }
  // 「欲しい」(いらん飯は上で種類ごとに数えたので除く)
  const want = list.filter(t => t.want && !(isExtraFood(t) && foodKind(t) !== OTHER_EXTRA));
  if (want.length) {
    const ws = Calc.sum(want);
    const top = want.slice().sort((a, b) => b.myr - a.myr).slice(0, 3).map(t => esc(t.note || t.category) + ' ' + Calc.rm(t.myr)).join('、');
    tips.push({ key: '欲しい', save: r2(perMonth(ws) / 2), title: '「欲しい」を半分にする',
      body: '「欲しい」は ' + want.length + '件で ' + Calc.rm(ws) + '。大きいもの: ' + top + '。' + Calc.rm(s.wishLine) + '以上は2日待つ。' });
  }
  // 小さな買い物(RM10未満、通信費などの固定的なものは除く)
  const small = list.filter(t => t.myr > 0 && t.myr < 10 && t.category !== '通信費' && !isExtraFood(t));
  if (small.length >= 8) {
    const ss = Calc.sum(small), cnt = {};
    small.forEach(t => { const k = (t.note || t.category).trim(); cnt[k] = (cnt[k] || 0) + 1; });
    const often = Object.keys(cnt).filter(k => cnt[k] >= 2).sort((a, b) => cnt[b] - cnt[a]).slice(0, 3).map(k => esc(k) + '×' + cnt[k]).join('、');
    tips.push({ key: '小さな買い物', save: r2(perMonth(ss) / 3), title: 'RM10未満のちょこちょこ買いを3分の1へらす',
      body: 'RM10未満の買い物が ' + small.length + '回で ' + Calc.rm(ss) + '。' + (often ? 'よく買うもの: ' + often + '。' : '') + '1回は小さくても、合わせると大きい。' });
  }
  // 1日の予算平均を超えた日
  const line = s.budget / dim, byDay = {};
  list.forEach(t => { byDay[t.date] = (byDay[t.date] || 0) + t.myr; });
  const over = Object.keys(byDay).filter(d => byDay[d] > line).sort();
  const big = list.filter(t => over.includes(t.date)).sort((a, b) => b.myr - a.myr).slice(0, 3)
    .map(t => Number(t.date.slice(5, 7)) + '/' + Number(t.date.slice(8)) + ' ' + esc(t.note || t.category) + ' ' + Calc.rm(t.myr)).join('、');
  // 来月: 減らせる額の大きい順に3つ(同じものを二重に数えないよう、デリバリーなどと「欲しい」は別々に数えている)
  // 「食費の目安」はデリバリーなどと重なるので、それらがあるときは3つに入れない
  const foodTip = tips.some(x => FOOD_KINDS.includes(x.key) || x.key === '割高');
  const pick = tips.filter(x => x.save > 0 && !(foodTip && x.key === '食費の目安')).sort((a, b) => b.save - a.save).slice(0, 3);
  const nextM = Calc.shift(month, 1), mb = S.settings.monthBudgets || {};
  const nextBudget = mb[nextM] > 0 ? mb[nextM] : S.settings.budget;   // 来月の予算(月別予算がなければ通常の月予算)
  const pace = r2(perMonth(total)), saved = r2(pick.reduce((a, x) => a + x.save, 0));
  return { days, total, cats, eat, tips, pick, over, big, line, nextM, nextBudget, pace, saved, after: r2(pace - saved) };
}
function renderAdvice() {

  const s = cfg(), a = advise(monthTx(), s, S.month, today());

  h += '</div>';
  // 先月とくらべる(この端末に先月の記録が残っていれば)

// ---- 読み込みと送信 ----
async function load() {
  const cached = store.get('kb-month-' + S.month, null);
  S.tx = cached ? cached.tx : [];
  S.loading = !cached;
  render();
  try {
    const res = await call('getData', S.month);
    if (res.month !== S.month) return;
    S.settings = res.settings; S.tx = res.tx; S.loading = false; S.offline = false; S.lastError = '';
    store.set('kb-ok', true);
    if (typeof res.spentSince === 'number') { S.spentSince = res.spentSince; store.set('kb-since', res.spentSince); }
    if (res.rentMonths) { S.rentMonths = res.rentMonths; store.set('kb-rent', res.rentMonths); }
    store.set('kb-settings', res.settings);
    store.set('kb-month-' + S.month, { tx: res.tx });
    const cur = $('currency'); if (cur.options.length && isNaN(amountValue())) cur.value = CURRENCIES.includes(res.settings.stayCurrency) ? res.settings.stayCurrency : 'MYR';
  } catch (e) {
    S.offline = true; S.loading = false; S.lastError = errMsg(e);
    // この端末でまだ一度もつながっていない、または合言葉違いなら、接続画面に戻して理由を出す
    const api = !window.mockApi && !API.inGas();
    if (api && !$('connect') && ((e && e.server && /合言葉/.test(e.message)) || (!store.get('kb-ok', false) && navigator.onLine !== false))) showConnect(S.lastError);
  }
  render();
  flush();
}

async function flush() {
  if (flush.busy) return; flush.busy = true;
  try {
    while (S.queue.length) {
      const q = S.queue[0];
      // 先頭の ' はスプシに「文字として入れる」合図。日付が勝手に日付型に変わるのを防ぐ
      const saved = await call('addTx', Object.assign({}, q, { date: "'" + q.date }));
      saved.date = String(saved.date).replace(/^'/, '');
      S.queue.shift(); store.set('kb-queue', S.queue);
      sinceAdjust(saved, 1);
      if (saved.date.slice(0, 7) === S.month) { S.tx = S.tx.filter(t => t.id !== saved.id).concat([saved]); store.set('kb-month-' + S.month, { tx: S.tx }); }
      if (saved.currency !== 'MYR' && saved.rate) store.set('kb-rate-' + saved.currency, saved.rate);
      S.offline = false; S.lastError = ''; render();
    }
  } catch (e) {
    S.offline = true; S.lastError = errMsg(e); render();
    if (String(e && e.message || e).includes('レート')) { toast(String(e.message || e)); }
  } finally { flush.busy = false; }
}

    amount: 0, currency: 'MYR', category: '食費', want: false, note: $('note').value.trim() || '家ごはん',
    trip: S.settings.tripTag || '', howEat: HOME, myr: 0 };
  S.queue.push(t); store.set('kb-queue', S.queue);
  resetForm();
  const mt = monthTx().filter(isHome), n = new Set(mt.map(x => x.date)).size;
  const meals = monthTx().filter(x => foodKind(x) === 'ごはん' && x.myr > 0);
  const avg = meals.length ? Math.round(Calc.sum(meals) / meals.length * 100) / 100 : 0;
  celebrate('家ごはん、えらい!', '<div class="label">今月 ' + n + '日目の家ごはん' + (avg ? '<br>外で食べたら 約' + Calc.rm(avg) + ' のところ' : '') + '</div>');
  render(); flush();
}

function resetForm() {
  K.nums = []; K.ops = []; K.cur = ''; renderAmount(); closePad();
  $('note').value = ''; $('date').value = today();
  S.form.want = false; S.form.howEat = '';
}

// ---- 操作 ----
$('cats').addEventListener('click', e => { const c = e.target.dataset.cat; if (!c) return; S.form.category = c; if (c !== '食費') { S.form.howEat = ''; S.form.want = false; } renderForm(); });
$('eatKinds').addEventListener('click', e => { const v = e.target.dataset.eat; if (!v) return; S.form.howEat = S.form.howEat === v ? '' : v; S.form.want = !!S.form.howEat && S.form.howEat !== 'ごはん'; renderForm(); });
$('home').addEventListener('click', saveHome);
$('need').addEventListener('click', () => { S.form.want = false; renderForm(); });
$('want').addEventListener('click', () => { S.form.want = true; renderForm(); });
['currency', 'date'].forEach(id => $(id).addEventListener('input', () => { renderAmount(); renderCheck(); }));
$('save').addEventListener('click', save);
$('amount').addEventListener('click', () => { $('pad').hidden ? openPad() : closePad(); });
$('pad').addEventListener('click', e => { const k = e.target.dataset.k; if (k) keyIn(k); });
// PCではキーボードでも打てる(テンキーが開いているとき)
document.addEventListener('keydown', e => {
  if ($('pad').hidden || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey) return;
  const map = { Backspace: 'del', Enter: 'ok', Escape: 'esc', Delete: 'ac' };
  const k = /^[0-9+\-*/]$/.test(e.key) ? e.key : map[e.key];
  if (!k) return;
  e.preventDefault();
  if (k === 'esc') closePad(); else keyIn(k);
});
document.addEventListener('click', e => { if (!$('pad').hidden && !e.target.closest('#pad, #amount')) closePad(); });
$('skip').addEventListener('click', () => { const m = amountMyr(); resetForm(); renderForm(); toast(m ? Calc.rm(m) + ' を守りました' : 'やめておきました'); });
$('prev').addEventListener('click', () => { S.month = Calc.shift(S.month, -1); S.selDay = null; load(); });
$('next').addEventListener('click', () => { S.month = Calc.shift(S.month, 1); S.selDay = null; load(); });
$('calendar').addEventListener('click', e => {
  if (e.target.dataset.close) { S.selDay = null; renderCalendar(); renderList(); return; }
  const b = e.target.closest('button[data-day]'); if (!b) return; S.selDay = S.selDay === b.dataset.day ? null : b.dataset.day; renderCalendar(); renderList();
});
$('tabs').addEventListener('click', e => { const t = e.target.dataset.tab; if (t) setTab(t); });
$('list').addEventListener('click', e => {
  if (e.target.dataset.all) { S.selDay = null; renderCalendar(); renderList(); return; }
  if (e.target.dataset.more) {
    S.listAll = !S.listAll; renderList();
    if (!S.listAll) $('list').scrollIntoView({ block: 'start', behavior: 'smooth' });
    return;
  }
  if (e.target.dataset.del) delTx(e.target.dataset.del);
});
$('fixed').addEventListener('click', e => {
  if (e.target.id === 'fxToggle') { store.set('kb-fixed-open', !store.get('kb-fixed-open', false)); renderFixed(); }
  if (e.target.dataset.fx) { fxCat = e.target.dataset.fx; renderFixed(); }
  if (e.target.dataset.del) delTx(e.target.dataset.del);
});
$('fxAmt').addEventListener('input', () => { $('fxSave').disabled = !(fxAmount() > 0); });
$('fxSave').addEventListener('click', saveFixed);
async function delTx(id) {
  const t = monthTx().find(x => x.id === id);
  if (!confirm((t.note || t.category) + ' ' + (t.myr != null ? Calc.rm(t.myr) : '') + ' を削除しますか?')) return;
  if (S.queue.some(q => q.id === id)) { S.queue = S.queue.filter(q => q.id !== id); store.set('kb-queue', S.queue); render(); return; }
  try { await call('deleteTx', id); sinceAdjust(t, -1); S.tx = S.tx.filter(x => x.id !== id); store.set('kb-month-' + S.month, { tx: S.tx }); render(); }
  catch (err) { toast('削除できませんでした。電波を確認してください'); }
}
window.addEventListener('online', flush);
$('hero').addEventListener('click', e => { if (e.target.id === 'resend') { toast('送信しています…'); flush(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

// ---- 初めて開いたときの接続 ----
// リンクの # の後ろに url= と key= があれば、それを保存して消す(合言葉を画面に残さない)
(function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('url') && h.get('key')) {
    API.set({ url: h.get('url').trim(), key: h.get('key').trim() });
    history.replaceState(null, '', location.pathname + location.search);
  }
})();

// つながらなかった理由を、mioさんが直せる言葉にする
function errMsg(e) {
  const m = String(e && e.message || e);
  if (e && (e.server || m.startsWith('URL'))) return m;
  if (navigator.onLine === false) return '電波がありません。つながる場所でもう一度押してください';
  return 'つながりませんでした。URLが「アクセスできるユーザー: 全員」のデプロイのものか確認してください(デプロイを管理で一番上のURL)';
}

function showConnect(msg) {
  const conf = API.get() || {};
  const box = document.createElement('div');
  box.className = 'connect'; box.id = 'connect';
  box.innerHTML = '<div class="card"><h2>スプレッドシートとつなぐ</h2>' +
    '<p>スプレッドシートの「家計簿」メニュー →「スマホ・PCをつなぐ」に出るURLと合言葉を貼ってください。この端末では最初の1回だけです。</p>' +
    '<label for="cUrl">URL(/exec で終わるもの)</label><input id="cUrl" autocomplete="off" autocapitalize="off" spellcheck="false">' +
    '<label for="cKey">合言葉</label><input id="cKey" autocomplete="off" autocapitalize="off" spellcheck="false">' +
    '<button id="cGo" type="button">つなぐ</button><div class="err" id="cErr"></div></div>';
  document.body.appendChild(box);
  $('cUrl').value = conf.url || ''; $('cKey').value = conf.key || '';
  $('cErr').textContent = msg || '';
  $('cGo').addEventListener('click', async () => {
    const c = { url: $('cUrl').value.trim(), key: $('cKey').value.trim() };
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(c.url)) { $('cErr').textContent = 'URLは https://script.google.com/ で始まるものを貼ってください'; return; }
    if (!c.key) { $('cErr').textContent = '合言葉を入れてください'; return; }
    $('cGo').disabled = true; $('cErr').textContent = '確認しています…';
    try { await callApi(c, 'getData', [S.month]); }
    catch (e) {
      $('cGo').disabled = false;
      $('cErr').textContent = errMsg(e);
      return;
    }
    API.set(c); store.set('kb-ok', true); box.remove(); showRelink(); load();
  });
}

// 画面の一番下に「つなぎ直す(今の接続先)」を出す
function showRelink() {
  let re = document.querySelector('.relink');
  if (!re) {
    re = document.createElement('button'); re.className = 'relink'; re.type = 'button';
    re.addEventListener('click', () => showConnect());
    $('status').after(re);
  }
  const id = ((API.get() || {}).url || '').match(/\/s\/([^/]+)/);
  re.textContent = 'つなぎ直す(今の接続先: ' + (id ? id[1].slice(0, 10) + '…' : 'なし') + ')';
}

function startApp() {
  setTab(store.get('kb-tab', 'in') === 'ana' ? 'ana' : 'in');
  renderAmount();
  if (!window.mockApi && !API.inGas()) {
    if (!API.get()) { showConnect(); return; }
    showRelink();
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  load();
  refreshJpy();
}
startApp();
</script>
</body>
