<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="theme-color" content="#f6f5f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>家計簿</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1f1f1d; --quiet: #6b6a66; --line: #e4e2dc;
    --accent: #2f6f5e; --accent-soft: #e3efe9; --warn: #c26a12; --warn-soft: #fbeedd;
    --bad: #b3261e; --bad-soft: #f9e2df; --chip: #efede8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #22221f; --ink: #f0efeb; --quiet: #a3a19b; --line: #34332f;
      --accent: #6cc1a6; --accent-soft: #1f3530; --warn: #f0a24f; --warn-soft: #3a2a17;
      --bad: #f2867d; --bad-soft: #3d201d; --chip: #2d2c29;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 12px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .month { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
  .month h1 { font-size: 17px; margin: 0; }
  .month button { border: 0; background: var(--chip); color: var(--ink); border-radius: 10px; width: 40px; height: 36px; font-size: 18px; }
  .label { font-size: 13px; color: var(--quiet); }
  .big { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
  .big.bad { color: var(--bad); }
  .sub { display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px; }
  .pill { background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 4px 10px; }
  .pill.warn { background: var(--warn-soft); } .pill.bad { background: var(--bad-soft); }
  .bar { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; margin: 14px 0 6px; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 99px; }
  .bar.warn > div { background: var(--warn); } .bar.bad > div { background: var(--bad); }
  .stack { position: relative; display: flex; gap: 2px; height: 12px; background: var(--chip); border-radius: 99px; overflow: hidden; margin: 14px 0 8px; }
  .stack > span { height: 100%; min-width: 2px; }
  .stack > span:last-of-type { border-radius: 0 4px 4px 0; }
  .stack > i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--quiet); margin-bottom: 6px; }
  .legend b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  :root { --c-food: #eb6834; --c-trans: #2a78d6; --c-daily: #1baf7a; --c-social: #eda100; --c-beauty: #e87ba4; --c-tel: #6250d6; --c-other: #9a9891; }
  @media (prefers-color-scheme: dark) { :root { --c-food: #d95926; --c-trans: #3987e5; --c-daily: #199e70; --c-social: #c98500; --c-beauty: #d55181; --c-tel: #9085e9; --c-other: #77756f; } }
  .row { display: flex; gap: 8px; align-items: center; }
  .amount { flex: 1; font-size: 28px; font-weight: 600; padding: 8px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
  select, input[type=text], input[type=date] { font: inherit; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--bg); color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
  .chip { border: 1px solid transparent; background: var(--chip); color: var(--ink); border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 14px; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
  .chip.want.on { background: var(--warn-soft); border-color: var(--warn); }
  .field { margin-top: 12px; }
  .field input[type=text] { width: 100%; }
  .check { margin-top: 12px; border-radius: 12px; padding: 12px; background: var(--warn-soft); font-size: 14px; }
  .check b { font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn { flex: 1; border: 0; border-radius: 12px; padding: 13px; font: inherit; font-weight: 600; background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--chip); color: var(--ink); }
  .btn:disabled { opacity: .45; }
  .day { display: flex; justify-content: space-between; font-size: 13px; color: var(--quiet); margin: 14px 0 4px; }
  .item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .item .what { flex: 1; min-width: 0; }
  .item .what small { color: var(--quiet); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .amt { text-align: right; font-variant-numeric: tabular-nums; }
  .item .amt small { display: block; color: var(--quiet); }
  .item .del { border: 0; background: none; color: var(--quiet); font-size: 18px; width: 32px; height: 32px; }
  .tag { font-size: 11px; border-radius: 6px; padding: 1px 6px; background: var(--warn-soft); margin-left: 4px; }
  .status { text-align: center; font-size: 12px; color: var(--quiet); margin-top: 8px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal .wd { text-align: center; font-size: 11px; color: var(--quiet); padding-bottom: 4px; }
  .cal .wd.sun { color: var(--bad); } .cal .wd.sat { color: var(--accent); }
  .cal button { border: 0; background: none; color: var(--ink); font: inherit; border-radius: 8px; padding: 4px 2px; min-height: 46px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
  .cal button .d { font-size: 12px; }
  .cal button .v { font-size: 10.5px; color: var(--quiet); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .cal button.over { background: var(--bad-soft); } .cal button.over .v { color: var(--bad); font-weight: 600; }
  .cal button.today .d { font-weight: 700; text-decoration: underline; }
  .cal button.sel { outline: 2px solid var(--accent); }
  .cal button:disabled { visibility: hidden; }
  .calfoot { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; font-size: 13px; color: var(--quiet); }
  .calfoot b { font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .linkbtn { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; padding: 0; }
  /* PCの広い画面: 入力欄とカレンダーを横に並べる */
  @media (min-width: 900px) {
    main { max-width: 1040px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
    .pair > .card { margin-bottom: 12px; }
    .cal button { min-height: 56px; }
    .cal button .v { font-size: 12px; }
  }
  button.amount { text-align: right; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; min-height: 58px; cursor: pointer; }
  button.amount.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  button.amount .ph { color: var(--quiet); }
  button.amount small { font-size: 13px; font-weight: 400; color: var(--quiet); }
  .pad { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    box-shadow: 0 -8px 24px rgba(0,0,0,.08); }
  .pad[hidden] { display: none; }
  .pad button { border: 0; border-radius: 10px; background: var(--chip); color: var(--ink); font: inherit; font-size: 24px; height: 54px; }
  .pad button:active { filter: brightness(.92); }
  .pad .op, .pad .fn { font-size: 20px; }
  .pad .del { color: var(--bad); }
  .pad .ok { grid-row: span 2; height: auto; background: var(--accent); color: #fff; font-weight: 700; }
  .pad .wide { grid-column: span 2; }
  body.padopen main { padding-bottom: 260px; }
  @media (min-width: 900px) { .pad { left: 50%; right: auto; width: 420px; transform: translateX(-50%); border: 1px solid var(--line); border-radius: 16px 16px 0 0; } }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; }
  .empty { color: var(--quiet); font-size: 14px; text-align: center; padding: 12px 0; }
  .jpy { color: var(--quiet); opacity: .75; font-size: 12px; font-weight: 400; margin-left: 6px; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .big + .jpyline { margin: -4px 0 8px; }
  .jpyline .jpy { margin-left: 0; font-size: 13px; }
  .item .amt .jpy { display: block; margin-left: 0; font-size: 11px; }
  .outlook h2 { font-size: 15px; margin: 0 0 2px; }
  .outlook .row2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .outlook .row2:first-of-type { border-top: 0; }
  .outlook .row2 b { font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .outlook .row2 b.bad { color: var(--bad); }
  .outlook .row2 small { display: block; color: var(--quiet); font-size: 12px; }
  .outlook .note { font-size: 13px; color: var(--quiet); line-height: 1.6; margin-top: 6px; }
  .outlook .trip { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .connect { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .connect .card { max-width: 460px; width: 100%; }
  .connect h2 { margin: 0 0 8px; font-size: 18px; }
  .connect p { color: var(--quiet); font-size: 14px; line-height: 1.6; margin: 0 0 12px; }
  .connect label { display: block; font-size: 13px; color: var(--quiet); margin: 10px 0 4px; }
  .connect input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
  .connect button { margin-top: 16px; width: 100%; padding: 12px; font-size: 16px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; }
  .connect .err { color: var(--warn); font-size: 14px; min-height: 1.4em; margin-top: 8px; }
  .relink { display: block; margin: 8px auto 0; background: none; border: 0; color: var(--quiet); font-size: 12px; text-decoration: underline; }
</style>
</head>
<body>
<main>
  <div class="month">
    <button id="prev" aria-label="前の月">‹</button>
    <h1 id="monthTitle"></h1>
    <button id="next" aria-label="次の月">›</button>
  </div>

  <section class="card" id="hero"></section>

  <div class="pair">
  <section class="card" id="form">
    <div class="row">
      <button id="amount" class="amount" type="button" aria-label="金額を入力"><span id="expr" class="ph">0.00</span><small id="result"></small></button>
      <select id="currency" aria-label="通貨"></select>
    </div>
    <div class="chips" id="cats"></div>
    <div class="chips" id="eats" hidden></div>
    <div class="chips">
      <button class="chip on" id="need" type="button">必要</button>
      <button class="chip want" id="want" type="button">欲しい</button>
    </div>
    <div class="field row">
      <input id="note" type="text" placeholder="内容(任意)" style="flex:1;min-width:0">
      <input id="date" type="date">
    </div>
    <div class="check" id="check" hidden></div>
    <div class="actions">
      <button class="btn ghost" id="skip" type="button" hidden>やめておく</button>
      <button class="btn" id="save" type="button" disabled>記録する</button>
    </div>
  </section>

  <section class="card" id="calendar"></section>
  </div>
  <section class="card outlook" id="outlook" hidden></section>
  <section class="card" id="list"></section>
  <div class="pad" id="pad" hidden>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="/" class="op">÷</button><button data-k="ac" class="fn">AC</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="*" class="op">×</button><button data-k="del" class="fn del">Del</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="-" class="op">−</button><button data-k="ok" class="ok">OK</button>
    <button data-k="0">0</button><button data-k="00" class="wide">00</button><button data-k="+" class="op">+</button>
  </div>
  <div class="status" id="status"></div>
</main>
<div class="toast" id="toast"></div>

<script>
// ---- 計算(画面と切り離した純粋な関数) ----
const Calc = {
  pad: n => String(n).padStart(2, '0'),
  ymd(d) { return d.getFullYear() + '-' + this.pad(d.getMonth() + 1) + '-' + this.pad(d.getDate()); },
  daysIn(month) { const [y, m] = month.split('-').map(Number); return new Date(y, m, 0).getDate(); },
  shift(month, k) { const [y, m] = month.split('-').map(Number); const d = new Date(y, m - 1 + k, 1); return d.getFullYear() + '-' + this.pad(d.getMonth() + 1); },
  // 予算に数える取引か(旅行タグ付き・除外区分・換算待ちは数えない)
  counts(t, s) { return !t.trip && !s.excluded.includes(t.category) && typeof t.myr === 'number' && !isNaN(t.myr); },
  sum(list) { return Math.round(list.reduce((a, t) => a + t.myr, 0) * 100) / 100; },
  summary(tx, s, month, today) {
    const inBudget = tx.filter(t => this.counts(t, s));
    const spent = this.sum(inBudget);
    const dim = this.daysIn(month);
    const isCurrent = today.slice(0, 7) === month;
    const out = { spent, budget: s.budget, left: Math.round((s.budget - spent) * 100) / 100, ratio: s.budget ? spent / s.budget : 0, isCurrent };
    if (isCurrent) {
      const day = Number(today.slice(8));
      const remaining = dim - day + 1;                       // 今日を含む残り日数
      const spentToday = this.sum(inBudget.filter(t => t.date === today));
      const before = spent - spentToday;                     // 昨日までに使った額
      out.remaining = remaining;
      out.daily = Math.round((s.budget - before) / remaining * 100) / 100;   // 今日の1日分(繰越込み)
      out.todayLeft = Math.round((out.daily - spentToday) * 100) / 100;
      const foodToday = this.sum(tx.filter(t => t.date === today && t.category === '食費' && typeof t.myr === 'number'));
      out.foodLeft = Math.round((s.foodDaily - foodToday) * 100) / 100;
      out.spentToday = spentToday;
    }
    return out;
  },
  // 買う前チェック: この金額を使うと明日からの1日分がどう変わるか
  impact(sum, s, amountMyr) {
    if (!sum.isCurrent) return null;
    if (sum.remaining <= 1) return { last: true, before: sum.todayLeft, after: Math.round((sum.todayLeft - amountMyr) * 100) / 100 };
    const r = sum.remaining - 1;
    const base = s.budget - sum.spent;
    return { before: Math.round(base / r * 100) / 100, after: Math.round((base - amountMyr) / r * 100) / 100, days: r };
  },
  rm(n) { const v = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (n < 0 ? '-RM' : 'RM') + v; },
};

// ---- サーバーとのやりとり ----
// Apps Script の中で開いたときは google.script.run、別の場所(Netlifyなど)で開いたときは
// 保存しておいたURLと合言葉でAPIを呼ぶ。テスト時は window.mockApi
const API = {
  get() { try { return JSON.parse(localStorage.getItem('kb-api') || 'null'); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem('kb-api', JSON.stringify(v)); } catch (e) {} },
  inGas() { return typeof google !== 'undefined' && google.script && google.script.run; },
};
async function callApi(conf, name, args) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 25000);
  try {
    // text/plain にすると事前確認(CORS preflight)なしで Apps Script に届く
    const res = await fetch(conf.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: conf.key, fn: name, args }), redirect: 'follow', signal: ctl.signal });
    const text = await res.text();
    let out;
    try { out = JSON.parse(text); } catch (e) { throw new Error('URLが違うか、デプロイのアクセスが「全員」になっていません'); }
    if (!out.ok) { const err = new Error(out.error); err.server = true; throw err; }
    return out.result;
  } finally { clearTimeout(timer); }
}
function call(name, ...args) {
  if (window.mockApi) return Promise.resolve().then(() => window.mockApi[name](...args));
  if (API.inGas()) return new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[name](...args));
  const conf = API.get();
  if (!conf) return Promise.reject(new Error('未接続'));
  return callApi(conf, name, args);
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

// ---- 状態 ----
const today = () => Calc.ymd(new Date());
// 表示中の月の設定。「月別予算」にその月があればそちらを使う(なければ通常の月予算)
const cfg = () => { const mb = S.settings.monthBudgets || {}; return Object.assign({}, S.settings, mb[S.month] > 0 ? { budget: mb[S.month] } : {}); };
const S = {
  month: today().slice(0, 7),
  settings: store.get('kb-settings', { budget: 1250, foodDaily: 20, wishLine: 50, stayCurrency: 'MYR', tripTag: '',
    categories: ['食費', '交通費', '日用品', '交際費', '美容', '通信費', '趣味・娯楽', '健康・医療', 'その他'], excluded: ['家賃', '固定費'] }),
  tx: [], queue: store.get('kb-queue', []), loading: true, offline: false, spentSince: store.get('kb-since', null), rentMonths: store.get('kb-rent', []),
  form: { category: '食費', howEat: '', want: false }, selDay: null,
};
const EATS = ['自炊', '外食', 'デリバリー', 'カフェ・おやつ'];
const WANT_EATS = ['デリバリー', 'カフェ・おやつ'];
const CURRENCIES = ['MYR', 'JPY', 'SGD', 'THB', 'BDT', 'USD', 'その他'];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

// ---- 日本円の目安(小さく薄く横に出す) ----
// レートは公開の為替API(1日2回まで取り直す)。取れないときは円で記録した明細のレートを使う
const FX = { jpy: (store.get('kb-jpy', null) || {}).rate || null };
async function refreshJpy() {
  const c = store.get('kb-jpy', null);
  if (c && Date.now() - c.t < 12 * 3600 * 1000) return;
  const srcs = [['https://api.frankfurter.app/latest?from=MYR&to=JPY', j => j.rates.JPY],
    ['https://open.er-api.com/v6/latest/MYR', j => j.rates.JPY]];
  for (const [u, pick] of srcs) {
    try {
      const r = pick(await (await fetch(u)).json());
      if (r > 0) { FX.jpy = r; store.set('kb-jpy', { rate: r, t: Date.now() }); render(); return; }
    } catch (e) {}
  }
}
function jpyRate() {
  if (FX.jpy) return FX.jpy;
  const t = S.tx.find(x => x.currency === 'JPY' && x.myr > 0);
  return t ? t.amount / t.myr : null;
}
const jp = myr => { const r = jpyRate(); return r && typeof myr === 'number' ? '<span class="jpy">≈¥' + Math.round(Math.abs(myr) * r).toLocaleString('en-US') + '</span>' : ''; };

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2600); }

function monthTx() {
  const pending = S.queue.filter(q => q.date.slice(0, 7) === S.month && !S.tx.some(t => t.id === q.id));
  return S.tx.concat(pending);
}

// ---- 描画 ----
// 区分ごとの色(区分に固定。順位で塗り替えない)。食費は一番目立つオレンジ
const CAT_COLORS = { '食費': 'food', '交通費': 'trans', '日用品': 'daily', '交際費': 'social', '美容': 'beauty', '通信費': 'tel' };
function stackBar(sum) {
  const by = {};
  monthTx().filter(t => Calc.counts(t, S.settings)).forEach(t => {
    const k = CAT_COLORS[t.category] ? t.category : 'その他';
    by[k] = (by[k] || 0) + t.myr;
  });
  const order = Object.keys(CAT_COLORS).concat(['その他']).filter(k => by[k] > 0);
  const scale = Math.max(sum.budget, sum.spent) || 1;
  const color = k => 'var(--c-' + (CAT_COLORS[k] || 'other') + ')';
  let bar = order.map(k => '<span style="width:' + (by[k] / scale * 100).toFixed(2) + '%;background:' + color(k) + '" title="' + k + ' ' + Calc.rm(by[k]) + '"></span>').join('');
  if (sum.spent > sum.budget) bar += '<i style="left:' + (sum.budget / scale * 100).toFixed(2) + '%" title="予算 ' + Calc.rm(sum.budget) + '"></i>';
  const legend = order.map(k => '<span><span class="sw" style="background:' + color(k) + '"></span>' + k + ' <b>' + Calc.rm(Math.round(by[k] * 100) / 100) + '</b></span>').join('');
  return '<div class="stack" role="img" aria-label="区分ごとの支出">' + bar + '</div><div class="legend">' + legend + '</div>';
}

// ---- 金額テンキー(セント入力: MYRは 1→0.01、125→1.25。円などは整数) ----
const NO_DECIMAL = ['JPY', 'KRW', 'IDR', 'VND', 'CLP', 'ISK', 'HUF', 'TWD'];
const K = { nums: [], ops: [], cur: '' };           // nums: 確定した数(桁の文字列)、ops: 演算子、cur: 入力中の数
const decOf = () => NO_DECIMAL.includes($('currency').value) ? 0 : 2;
const numOf = d => Number(d || '0') / Math.pow(10, decOf());
const fmtN = v => v.toLocaleString('en-US', { minimumFractionDigits: decOf(), maximumFractionDigits: decOf() });
const OPS = { '+': '+', '-': '−', '*': '×', '/': '÷' };
function evalK() {
  const nums = K.nums.map(numOf), ops = K.ops.slice();
  if (K.cur !== '' || !ops.length) nums.push(numOf(K.cur)); else ops.pop();
  // × ÷ を先に計算
  const n = [nums[0]], o = [];
  ops.forEach((op, i) => {
    const v = nums[i + 1];
    if (op === '*') n[n.length - 1] *= v;
    else if (op === '/') n[n.length - 1] = v ? n[n.length - 1] / v : NaN;
    else { o.push(op); n.push(v); }
  });
  let r = n[0];
  o.forEach((op, i) => { r = op === '+' ? r + n[i + 1] : r - n[i + 1]; });
  const f = Math.pow(10, decOf());
  return Math.round(r * f) / f;
}
function amountValue() { return (K.nums.length || K.cur !== '') ? evalK() : NaN; }
function renderAmount() {
  const empty = !K.nums.length && K.cur === '';
  let txt = '';
  K.nums.forEach((d, i) => { txt += fmtN(numOf(d)) + ' ' + OPS[K.ops[i]] + ' '; });
  if (K.cur !== '' || !K.nums.length) txt += fmtN(numOf(K.cur));
  $('expr').textContent = empty ? fmtN(0) : txt.trim();
  $('expr').className = empty ? 'ph' : '';
  const v = amountValue();
  $('result').textContent = K.ops.length && !isNaN(v) ? '= ' + fmtN(v) : (K.ops.length ? '計算できません' : '');
}
function keyIn(k) {
  if (/^\d+$/.test(k)) { if ((K.cur + k).length <= 9) K.cur = (K.cur + k).replace(/^0+(?=\d)/, ''); if (K.cur === '0' || K.cur === '00') K.cur = ''; }
  else if (OPS[k]) {
    if (K.cur !== '') { K.nums.push(K.cur); K.ops.push(k); K.cur = ''; }
    else if (K.ops.length) K.ops[K.ops.length - 1] = k;
  }
  else if (k === 'del') { if (K.cur !== '') K.cur = K.cur.slice(0, -1); else if (K.ops.length) { K.ops.pop(); K.cur = K.nums.pop(); } }
  else if (k === 'ac') { K.nums = []; K.ops = []; K.cur = ''; }
  else if (k === 'ok') {
    const v = amountValue();
    if (K.ops.length && v > 0) { const f = Math.pow(10, decOf()); K.nums = []; K.ops = []; K.cur = String(Math.round(v * f)); }
    else if (!K.ops.length) closePad();
  }
  renderAmount(); renderCheck();
}
function openPad() { $('pad').hidden = false; $('amount').classList.add('on'); document.body.classList.add('padopen'); }
function closePad() { $('pad').hidden = true; $('amount').classList.remove('on'); document.body.classList.remove('padopen'); }

// ---- 年末までの見通し: このペースで使うと、旅行や貯金にいくら回せるか ----
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
// 送った・消した記録を、次に読み込むまでの間も残高に反映する
function sinceAdjust(t, sign) {
  const since = String((S.settings.raw || {})['残高の日付'] || '');
  if (!since || !(t.date > since) || typeof S.spentSince !== 'number') return;
  S.spentSince = Math.round((S.spentSince + sign * (t.myr || 0)) * 100) / 100; store.set('kb-since', S.spentSince);
  if (t.category === '家賃' && sign > 0 && !S.rentMonths.includes(t.date.slice(0, 7))) { S.rentMonths.push(t.date.slice(0, 7)); store.set('kb-rent', S.rentMonths); }
}
function outlook() {
  const raw = S.settings.raw;
  if (!raw) return null;
  const bal = Number(raw['残高(MYR)']), since = String(raw['残高の日付'] || '');
  if (!(bal > 0) || !/^\d{4}-\d{2}-\d{2}$/.test(since)) return { need: true };
  const end = /^\d{4}-\d{2}-\d{2}$/.test(String(raw['見通しの期日'])) ? String(raw['見通しの期日']) : today().slice(0, 4) + '-12-31';
  const rent = Number(raw['家賃(MYR/月)']) || 0;
  // 今の残高 = 残高 − 残高の日付より後の支出すべて(サーバーの集計 + まだ送っていない分)
  const unsent = S.queue.filter(q => q.date > since && !S.tx.some(t => t.id === q.id)).reduce((a, q) => a + (q.myr || 0), 0);
  const now = Math.round((bal - (S.spentSince || 0) - unsent) * 100) / 100;
  // これから払う家賃: 残高の日付の翌月から期日の月までで、「家賃」をまだ記録していない月
  const paid = new Set(S.rentMonths || []);
  S.queue.filter(q => q.category === '家賃' && q.date > since).forEach(q => paid.add(q.date.slice(0, 7)));
  let months = 0;
  for (let m = Calc.shift(since.slice(0, 7), 1); m <= end.slice(0, 7); m = Calc.shift(m, 1)) if (!paid.has(m)) months++;
  const t = today();
  const daysLeft = Math.max(0, daysBetween(t, end));           // 明日から期日まで
  const cur = Calc.summary(S.month === t.slice(0, 7) ? monthTx() : [], cfg(), t.slice(0, 7), t);
  const dayNo = Number(t.slice(8));
  const pace = Math.round(cur.spent / dayNo * 100) / 100;       // 今月の1日あたり(予算に入る支出だけ)
  const plan = Math.round(S.settings.budget * 12 / 365 * 100) / 100; // 通常の月予算どおりの1日分
  const base = now - rent * months;
  const r2 = n => Math.round(n * 100) / 100;
  const trips = String(raw['旅行の予算'] || '').split(',').map(x => x.trim().match(/^(.+?)\s*=\s*([\d.]+)$/)).filter(Boolean).map(m => ({ name: m[1], amt: Number(m[2]) }));
  return { now, end, daysLeft, months, rent, pace, plan, atPace: r2(base - pace * daysLeft), atPlan: r2(base - plan * daysLeft), trips, tripSum: r2(trips.reduce((a, x) => a + x.amt, 0)) };
}
function renderOutlook() {
  const box = $('outlook');
  const o = S.month === today().slice(0, 7) ? outlook() : null;
  box.hidden = !o;
  if (!o) return;
  if (o.need) {
    box.innerHTML = '<h2>年末までの見通し</h2><div class="note">設定シートに「残高(MYR)」と「残高の日付」を入れると、このペースで使ったときに旅行や貯金へいくら回せるかをここに出します。</div>';
    return;
  }
  const [, em, ed] = o.end.split('-');
  const val = n => '<b class="' + (n < 0 ? 'bad' : '') + '">' + Calc.rm(n) + '</b>' + jp(n);
  let h = '<div class="row2"><span>今の残高<small>記録した支出を引いた計算上の額</small></span><span>' + val(o.now) + '</span></div>' +
    '<h2 style="margin-top:12px">' + Number(em) + '/' + Number(ed) + 'までの見通し</h2><div class="label">あと' + o.daysLeft + '日' + (o.months ? '・これから払う家賃 ' + Calc.rm(o.rent) + '×' + o.months + 'か月を引いたあと' : '') + '</div>' +
    '<div class="row2"><span>今月のペースのまま<small>1日 ' + Calc.rm(o.pace) + '</small></span><span>' + val(o.atPace) + '</span></div>' +
    '<div class="row2"><span>予算どおりなら<small>1日 ' + Calc.rm(o.plan) + '(月 ' + Calc.rm(S.settings.budget) + ')</small></span><span>' + val(o.atPlan) + '</span></div>';
  const diff = Math.round((o.atPlan - o.atPace) * 100) / 100;
  if (diff > 0) h += '<div class="note">予算どおりにすると、旅行に <b>' + Calc.rm(diff) + '</b>' + jp(diff) + ' 多く回せます。</div>';
  if (o.trips.length) {
    h += '<div class="note" style="margin-top:10px">旅行の予算</div>' + o.trips.map(x => '<div class="trip"><span>' + esc(x.name) + '</span><span>' + Calc.rm(x.amt) + jp(x.amt) + '</span></div>').join('') +
      '<div class="row2"><span>旅行のあと残る<small>今月のペースのまま</small></span><span>' + val(Math.round((o.atPace - o.tripSum) * 100) / 100) + '</span></div>';
  } else {
    h += '<div class="note">日本・キロロ・バングラデシュの費用が決まったら、設定シートの「旅行の予算」に バングラデシュ=1500, 日本=3000 のように入れると、ここで引き算します。</div>';
  }
  box.innerHTML = h;
}

function render() { renderHero(); renderForm(); renderCalendar(); renderOutlook(); renderList(); renderStatus(); }

// ---- 読み込みと送信 ----
async function load() {
  const cached = store.get('kb-month-' + S.month, null);
  S.tx = cached ? cached.tx : [];
  S.loading = !cached;
  render();
  try {
    const res = await call('getData', S.month);
    if (res.month !== S.month) return;
    S.settings = res.settings; S.tx = res.tx; S.loading = false; S.offline = false;
    if (typeof res.spentSince === 'number') { S.spentSince = res.spentSince; store.set('kb-since', res.spentSince); }
    if (res.rentMonths) { S.rentMonths = res.rentMonths; store.set('kb-rent', res.rentMonths); }
    store.set('kb-settings', res.settings);
    store.set('kb-month-' + S.month, { tx: res.tx });
    const cur = $('currency'); if (cur.options.length && isNaN(amountValue())) cur.value = CURRENCIES.includes(res.settings.stayCurrency) ? res.settings.stayCurrency : 'MYR';
  } catch (e) {
    S.offline = true; S.loading = false;
    if (e && e.server && /合言葉/.test(e.message) && !$('connect')) showConnect(e.message);
  }
  render();
  flush();
}

async function flush() {
  if (flush.busy) return; flush.busy = true;
  try {
    while (S.queue.length) {
      const q = S.queue[0];
      const saved = await call('addTx', q);
      S.queue.shift(); store.set('kb-queue', S.queue);
      sinceAdjust(saved, 1);
      if (saved.date.slice(0, 7) === S.month) { S.tx = S.tx.filter(t => t.id !== saved.id).concat([saved]); store.set('kb-month-' + S.month, { tx: S.tx }); }
      if (saved.currency !== 'MYR' && saved.rate) store.set('kb-rate-' + saved.currency, saved.rate);
      S.offline = false; render();
    }
  } catch (e) {
    S.offline = true; renderStatus();
    if (String(e && e.message || e).includes('レート')) { toast(String(e.message || e)); }
  } finally { flush.busy = false; }
}

function save() {
  const a = amountValue();
  if (!(a > 0)) return;
  let cur = $('currency').value;
  if (cur === 'その他') { cur = (prompt('通貨コード(例: HKD, KRW)') || '').trim().toUpperCase(); if (!/^[A-Z]{3}$/.test(cur)) return; }
  const f = S.form;
  const t = { id: 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: $('date').value || today(),
    amount: a, currency: cur, category: f.category, want: f.want, note: $('note').value.trim(),
    trip: S.settings.tripTag || '', howEat: f.category === '食費' ? f.howEat : '', myr: cur === 'MYR' ? a : null };
  S.queue.push(t); store.set('kb-queue', S.queue);
  resetForm();
  toast('記録しました ' + (cur === 'MYR' ? Calc.rm(a) : cur + ' ' + a));
  render(); flush();
}

function resetForm() {
  K.nums = []; K.ops = []; K.cur = ''; renderAmount(); closePad();
  $('note').value = ''; $('date').value = today();
  S.form.want = false; S.form.howEat = '';
}

// ---- 操作 ----
$('cats').addEventListener('click', e => { const c = e.target.dataset.cat; if (!c) return; S.form.category = c; if (c !== '食費') S.form.howEat = ''; renderForm(); });
$('eats').addEventListener('click', e => { const v = e.target.dataset.eat; if (!v) return; S.form.howEat = S.form.howEat === v ? '' : v; if (WANT_EATS.includes(S.form.howEat)) S.form.want = true; renderForm(); });
$('need').addEventListener('click', () => { S.form.want = false; renderForm(); });
$('want').addEventListener('click', () => { S.form.want = true; renderForm(); });
['currency', 'date'].forEach(id => $(id).addEventListener('input', () => { renderAmount(); renderCheck(); }));
$('save').addEventListener('click', save);
$('amount').addEventListener('click', () => { $('pad').hidden ? openPad() : closePad(); });
$('pad').addEventListener('click', e => { const k = e.target.dataset.k; if (k) keyIn(k); });
// PCではキーボードでも打てる(テンキーが開いているとき)
document.addEventListener('keydown', e => {
  if ($('pad').hidden || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey) return;
  const map = { Backspace: 'del', Enter: 'ok', Escape: 'esc', Delete: 'ac' };
  const k = /^[0-9+\-*/]$/.test(e.key) ? e.key : map[e.key];
  if (!k) return;
  e.preventDefault();
  if (k === 'esc') closePad(); else keyIn(k);
});
document.addEventListener('click', e => { if (!$('pad').hidden && !e.target.closest('#pad, #amount')) closePad(); });
$('skip').addEventListener('click', () => { const m = amountMyr(); resetForm(); renderForm(); toast(m ? Calc.rm(m) + ' を守りました' : 'やめておきました'); });
$('prev').addEventListener('click', () => { S.month = Calc.shift(S.month, -1); S.selDay = null; load(); });
$('next').addEventListener('click', () => { S.month = Calc.shift(S.month, 1); S.selDay = null; load(); });
$('calendar').addEventListener('click', e => { const b = e.target.closest('button[data-day]'); if (!b) return; S.selDay = S.selDay === b.dataset.day ? null : b.dataset.day; renderCalendar(); renderList(); });
$('list').addEventListener('click', async e => {
  if (e.target.dataset.all) { S.selDay = null; renderCalendar(); renderList(); return; }
  const id = e.target.dataset.del; if (!id) return;
  const t = monthTx().find(x => x.id === id);
  if (!confirm((t.note || t.category) + ' ' + (t.myr != null ? Calc.rm(t.myr) : '') + ' を削除しますか?')) return;
  if (S.queue.some(q => q.id === id)) { S.queue = S.queue.filter(q => q.id !== id); store.set('kb-queue', S.queue); render(); return; }
  try { await call('deleteTx', id); sinceAdjust(t, -1); S.tx = S.tx.filter(x => x.id !== id); store.set('kb-month-' + S.month, { tx: S.tx }); render(); }
  catch (err) { toast('削除できませんでした。電波を確認してください'); }
});
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

// ---- 初めて開いたときの接続 ----
// リンクの # の後ろに url= と key= があれば、それを保存して消す(合言葉を画面に残さない)
(function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('url') && h.get('key')) {
    API.set({ url: h.get('url').trim(), key: h.get('key').trim() });
    history.replaceState(null, '', location.pathname + location.search);
  }
})();

function showConnect(msg) {
  const conf = API.get() || {};
  const box = document.createElement('div');
  box.className = 'connect'; box.id = 'connect';
  box.innerHTML = '<div class="card"><h2>スプレッドシートとつなぐ</h2>' +
    '<p>スプレッドシートの「家計簿」メニュー →「スマホ・PCをつなぐ」に出るURLと合言葉を貼ってください。この端末では最初の1回だけです。</p>' +
    '<label for="cUrl">URL(/exec で終わるもの)</label><input id="cUrl" autocomplete="off" autocapitalize="off" spellcheck="false">' +
    '<label for="cKey">合言葉</label><input id="cKey" autocomplete="off" autocapitalize="off" spellcheck="false">' +
    '<button id="cGo" type="button">つなぐ</button><div class="err" id="cErr"></div></div>';
  document.body.appendChild(box);
  $('cUrl').value = conf.url || ''; $('cKey').value = conf.key || '';
  $('cErr').textContent = msg || '';
  $('cGo').addEventListener('click', async () => {
    const c = { url: $('cUrl').value.trim(), key: $('cKey').value.trim() };
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(c.url)) { $('cErr').textContent = 'URLは https://script.google.com/ で始まるものを貼ってください'; return; }
    if (!c.key) { $('cErr').textContent = '合言葉を入れてください'; return; }
    $('cGo').disabled = true; $('cErr').textContent = '確認しています…';
    try { await callApi(c, 'getData', [S.month]); }
    catch (e) {
      $('cGo').disabled = false;
      $('cErr').textContent = e.server || e.message.startsWith('URL') ? e.message : (navigator.onLine === false ? '電波がありません。つながる場所でもう一度押してください' : 'つながりませんでした。Apps Scriptの「デプロイを管理」で、アクセスできるユーザーが「全員」になっているか確認してください');
      return;
    }
    API.set(c); box.remove(); load();
  });
}

function startApp() {
  renderAmount();
  if (!window.mockApi && !API.inGas()) {
    if (!API.get()) { showConnect(); return; }
    const st = $('status');
    const re = document.createElement('button');
    re.className = 'relink'; re.type = 'button'; re.textContent = 'つなぎ直す';
    re.addEventListener('click', () => showConnect());
    st.after(re);
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  load();
  refreshJpy();
}
startApp();
</script>
</body>
